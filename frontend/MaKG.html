  <script type="text/babel">

// ── DATA ────────────────────────────────────────────────────────────────
const MAKG_DATA = (() => {
  const ENTITY_TYPES = {
    METABOLIC_CONDITION: { color: '#2e7d9e' },

  };

  const ENTITIES = [
  { id: 'type2_diabetes', labels: ['Type 2 Diabetes'], type: 'METABOLIC_CONDITION', metadata: { confidence: 0.97, source: 'PubMed', description: 'Chronic metabolic disorder' } },
  { id: 'insulin_resistance', labels: ['Insulin Resistance'], type: 'METABOLIC_CONDITION', metadata: { confidence: 0.95, source: 'PubMed', description: 'Reduced cellular response to insulin' } },
  { id: 'metabolic_syndrome', labels: ['Metabolic Syndrome'], type: 'METABOLIC_CONDITION', metadata: { confidence: 0.93, source: 'PubMed', description: 'Cluster of conditions' } },
  { id: 'obesity', labels: ['Obesity'], type: 'METABOLIC_CONDITION', metadata: { confidence: 0.96, source: 'PubMed', description: 'Excess body fat' } },
  { id: 'hba1c', labels: ['HbA1c'], type: 'BIOMARKER', metadata: { confidence: 0.98, source: 'ADA', description: 'Blood glucose marker' } },
  { id: 'fasting_glucose', labels: ['Fasting Glucose'], type: 'BIOMARKER', metadata: { confidence: 0.97, source: 'ADA', description: 'Plasma glucose' } },
  { id: 'adiponectin', labels: ['Adiponectin'], type: 'BIOMARKER', metadata: { confidence: 0.89, source: 'PubMed', description: 'Insulin-sensitizing adipokine' } },
  { id: 'il6', labels: ['Interleukin-6'], type: 'BIOMARKER', metadata: { confidence: 0.94, source: 'PubMed', description: 'Pro-inflammatory cytokine' } },
  { id: 'crp', labels: ['C-Reactive Protein'], type: 'BIOMARKER', metadata: { confidence: 0.96, source: 'PubMed', description: 'Inflammation marker' } },
  { id: 'insulin_level', labels: ['Serum Insulin'], type: 'BIOMARKER', metadata: { confidence: 0.95, source: 'ADA', description: 'Circulating insulin' } },
  { id: 'bmi', labels: ['BMI'], type: 'CLINICAL_MEASURE', metadata: { confidence: 0.99, source: 'WHO', description: 'Weight-to-height ratio' } },
  { id: 'waist_circumference', labels: ['Waist Circumference'], type: 'CLINICAL_MEASURE', metadata: { confidence: 0.97, source: 'WHO', description: 'Abdominal obesity measure' } },
  { id: 'homa_ir', labels: ['HOMA-IR'], type: 'CLINICAL_MEASURE', metadata: { confidence: 0.93, source: 'Clinical', description: 'Insulin resistance index' } },
  { id: 'gc_ms', labels: ['GC-MS'], type: 'METHOD', metadata: { confidence: 0.92, source: 'Methods', description: 'Metabolomics platform' } },
  { id: 'rna_seq', labels: ['RNA-seq'], type: 'METHOD', metadata: { confidence: 0.95, source: 'Methods', description: 'Gene expression' } },
  { id: 'gwas', labels: ['GWAS'], type: 'METHOD', metadata: { confidence: 0.97, source: 'Methods', description: 'Genetic association' } },
  { id: 'elisa', labels: ['ELISA'], type: 'METHOD', metadata: { confidence: 0.98, source: 'Methods', description: 'Protein quantification' } },
  { id: 'biomarker_discovery', labels: ['Biomarker Discovery'], type: 'TASK', metadata: { confidence: 0.88, source: 'Research', description: 'Identify markers' } },
  { id: 'risk_stratification', labels: ['Risk Stratification'], type: 'TASK', metadata: { confidence: 0.90, source: 'Clinical', description: 'Patient risk assessment' } },
  { id: 'blood_plasma', labels: ['Blood Plasma'], type: 'MATERIAL', metadata: { confidence: 0.99, source: 'Protocol', description: 'Primary biofluid' } },
  { id: 'adipose_tissue', labels: ['Adipose Tissue'], type: 'MATERIAL', metadata: { confidence: 0.95, source: 'Anatomy', description: 'Fat tissue' } },
  { id: 'urine_sample', labels: ['Urine Sample'], type: 'MATERIAL', metadata: { confidence: 0.96, source: 'Protocol', description: 'Non-invasive biofluid' } }];


  const TRIPLES = [
  { id: 't1', subject: 'type2_diabetes', relation: 'IS_ASSOCIATED_WITH', object: 'insulin_resistance', confidence: 0.97 },
  { id: 't2', subject: 'type2_diabetes', relation: 'HAS_BIOMARKER', object: 'hba1c', confidence: 0.98 },
  { id: 't3', subject: 'insulin_resistance', relation: 'MEASURED_BY', object: 'homa_ir', confidence: 0.93 },
  { id: 't4', subject: 'insulin_resistance', relation: 'INCREASES_LEVEL_OF', object: 'il6', confidence: 0.85 },
  { id: 't5', subject: 'insulin_resistance', relation: 'DECREASES_LEVEL_OF', object: 'adiponectin', confidence: 0.87 },
  { id: 't6', subject: 'metabolic_syndrome', relation: 'INCLUDES_CRITERION', object: 'bmi', confidence: 0.92 },
  { id: 't7', subject: 'metabolic_syndrome', relation: 'INCLUDES_CRITERION', object: 'waist_circumference', confidence: 0.91 },
  { id: 't8', subject: 'obesity', relation: 'MEASURED_BY', object: 'bmi', confidence: 0.99 },
  { id: 't9', subject: 'obesity', relation: 'MEASURED_BY', object: 'waist_circumference', confidence: 0.95 },
  { id: 't10', subject: 'hba1c', relation: 'QUANTIFIED_BY', object: 'elisa', confidence: 0.96 },
  { id: 't11', subject: 'hba1c', relation: 'MEASURED_IN', object: 'blood_plasma', confidence: 0.97 },
  { id: 't12', subject: 'fasting_glucose', relation: 'MEASURED_IN', object: 'blood_plasma', confidence: 0.98 },
  { id: 't13', subject: 'adiponectin', relation: 'EXPRESSED_IN', object: 'adipose_tissue', confidence: 0.93 },
  { id: 't14', subject: 'il6', relation: 'MEASURED_IN', object: 'blood_plasma', confidence: 0.95 },
  { id: 't15', subject: 'il6', relation: 'UPREGULATED_IN', object: 'adipose_tissue', confidence: 0.88 },
  { id: 't16', subject: 'crp', relation: 'INDICATES', object: 'metabolic_syndrome', confidence: 0.87 },
  { id: 't17', subject: 'crp', relation: 'QUANTIFIED_BY', object: 'elisa', confidence: 0.97 },
  { id: 't18', subject: 'insulin_level', relation: 'QUANTIFIED_BY', object: 'elisa', confidence: 0.97 },
  { id: 't19', subject: 'homa_ir', relation: 'DERIVED_FROM', object: 'fasting_glucose', confidence: 0.99 },
  { id: 't20', subject: 'homa_ir', relation: 'DERIVED_FROM', object: 'insulin_level', confidence: 0.99 },
  { id: 't21', subject: 'gc_ms', relation: 'APPLIED_TO', object: 'urine_sample', confidence: 0.90 },
  { id: 't22', subject: 'gc_ms', relation: 'ENABLES', object: 'biomarker_discovery', confidence: 0.88 },
  { id: 't23', subject: 'rna_seq', relation: 'APPLIED_TO', object: 'adipose_tissue', confidence: 0.93 },
  { id: 't24', subject: 'gwas', relation: 'IDENTIFIES', object: 'type2_diabetes', confidence: 0.89 },
  { id: 't25', subject: 'risk_stratification', relation: 'USES', object: 'hba1c', confidence: 0.93 },
  { id: 't26', subject: 'risk_stratification', relation: 'USES', object: 'bmi', confidence: 0.91 }];


  const SAMPLE_QA = [
  {
    id: 'qa1',
    question: 'Which biomarkers are elevated in metabolic syndrome?',
    answer: 'C-Reactive Protein (CRP) is consistently elevated, quantified via ELISA from blood plasma. Interleukin-6 (IL-6) is also elevated and upregulated in adipose tissue. HOMA-IR score, derived from fasting glucose and insulin, reflects insulin resistance central to metabolic syndrome.',
    referencedNodes: new Set(['crp', 'il6', 'insulin_level', 'metabolic_syndrome', 'elisa', 'blood_plasma', 'homa_ir', 'fasting_glucose', 'bmi']),
    referencedEdges: new Set(['t16', 't17', 't14', 't15', 't19', 't20', 't6', 't7']),
    model: 'GPT-4o', timestamp: '09:14', nodeCount: 9
  },
  {
    id: 'qa2',
    question: 'What methods are used to study diabetes biomarkers?',
    answer: 'GC-MS metabolomics applied to urine samples enables biomarker discovery. RNA-seq of adipose tissue reveals transcriptional regulation. GWAS identifies genetic variants. ELISA quantifies circulating markers from blood plasma.',
    referencedNodes: new Set(['gc_ms', 'rna_seq', 'gwas', 'elisa', 'urine_sample', 'adipose_tissue', 'blood_plasma', 'biomarker_discovery']),
    referencedEdges: new Set(['t21', 't22', 't23', 't24', 't10', 't11', 't12']),
    model: 'GPT-5', timestamp: '10:02', nodeCount: 8
  }];


  const RELATION_TYPES = [...new Set(TRIPLES.map((t) => t.relation))];
  return { ENTITY_TYPES, ENTITIES, TRIPLES, SAMPLE_QA, RELATION_TYPES };
})();

// ── GRAPH CANVAS ────────────────────────────────────────────────────────
const { useEffect, useRef, useState, useMemo, useCallback } = React;
const { ENTITY_TYPES, ENTITIES, TRIPLES, SAMPLE_QA, RELATION_TYPES } = MAKG_DATA;

const TEAL = '#1de9b6';
const INDIGO = '#7c83e8';
const EDGE_COLOR = '#7c83e8';
const EDGE_HL_COLOR = '#1de9b6';
const NODE_MIN_R = 6;
const NODE_MAX_R = 22;

function nodeRadius(degree, maxDegree) {
  if (!maxDegree) return NODE_MIN_R;
  return NODE_MIN_R + degree / maxDegree * (NODE_MAX_R - NODE_MIN_R);
}

function GraphCanvas({
  entities, triples, mode,
  highlightedNodes, highlightedEdges,
  selectedNodeId, onNodeClick,
  hoveredChipNodeId, tweaks
}) {
  const svgRef = useRef(null);
  const simRef = useRef(null);
  const nodeGrpRef = useRef(null);
  const linkGrpRef = useRef(null);
  const degreesRef = useRef({});
  const maxDegreeRef = useRef(1);
  const zoomBehavRef = useRef(null);
  const [detailNode, setDetailNode] = useState(null);
  const [detailPos, setDetailPos] = useState({ x: 0, y: 0 });

  const neighborMap = useMemo(() => {
    const map = {};
    triples.forEach((t) => {
      if (!map[t.subject]) map[t.subject] = [];
      if (!map[t.object]) map[t.object] = [];
      map[t.subject].push({ dir: 'out', relation: t.relation, id: t.object });
      map[t.object].push({ dir: 'in', relation: t.relation, id: t.subject });
    });
    return map;
  }, [triples]);

  useEffect(() => {
    if (!svgRef.current || !entities.length) return;
    const svg = d3.select(svgRef.current);
    const width = svgRef.current.clientWidth || 900;
    const height = svgRef.current.clientHeight || 700;
    svg.selectAll('*').remove();

    const defs = svg.append('defs');
    const addMarker = (id, color, opacity) => {
      defs.append('marker').
      attr('id', id).attr('viewBox', '0 0 10 7').attr('refX', 9).attr('refY', 3.5).
      attr('markerWidth', 6).attr('markerHeight', 5).attr('orient', 'auto').
      append('polygon').
      attr('points', '0 0, 10 3.5, 0 7').attr('fill', color).attr('fill-opacity', opacity);
    };
    addMarker('arrow-normal', EDGE_COLOR, 0.65);
    addMarker('arrow-hl', EDGE_HL_COLOR, 1);

    const entityMap = {};
    entities.forEach((e) => {entityMap[e.id] = e;});
    const nodes = entities.map((e) => ({ ...e }));
    const links = triples.
    filter((t) => entityMap[t.subject] && entityMap[t.object] && t.subject !== t.object).
    map((t) => ({ ...t, source: t.subject, target: t.object }));

    const degrees = {};
    nodes.forEach((n) => {degrees[n.id] = 0;});
    links.forEach((l) => {
      degrees[l.subject] = (degrees[l.subject] || 0) + 1;
      degrees[l.object] = (degrees[l.object] || 0) + 1;
    });
    const maxDegree = Math.max(...Object.values(degrees), 1);
    degreesRef.current = degrees;
    maxDegreeRef.current = maxDegree;

    const g = svg.append('g').attr('class', 'graph-root');
    const zoom = d3.zoom().
    scaleExtent([0.08, 4]).
    on('zoom', (ev) => g.attr('transform', ev.transform));
    svg.call(zoom).on('dblclick.zoom', null);
    zoomBehavRef.current = zoom;

    const linkGroup = g.append('g').attr('class', 'links');
    const link = linkGroup.selectAll('line').
    data(links).join('line').
    attr('stroke', EDGE_COLOR).
    attr('stroke-width', (d) => Math.max(0.6, (d.confidence || 0.7) * 1.4)).
    attr('stroke-opacity', tweaks?.edgeOpacity ?? 0.45).
    attr('marker-end', 'url(#arrow-normal)');

    linkGrpRef.current = link;

    const drag = d3.drag().
    on('start', (ev, d) => {if (!ev.active) sim.alphaTarget(0.3).restart();d.fx = d.x;d.fy = d.y;}).
    on('drag', (ev, d) => {d.fx = ev.x;d.fy = ev.y;}).
    on('end', (ev, d) => {if (!ev.active) sim.alphaTarget(0);d.fx = null;d.fy = null;});

    const nodeGroup = g.append('g').attr('class', 'nodes').
    selectAll('g').data(nodes).join('g').
    attr('class', 'node-group').attr('cursor', 'pointer').
    call(drag).
    on('click', function (ev, d) {
      ev.stopPropagation();
      const neighbors = neighborMap[d.id] || [];
      const rect = svgRef.current.getBoundingClientRect();
      const nodeScreenX = (d.x || 0) + rect.left;
      const nodeScreenY = (d.y || 0) + rect.top;
      setDetailPos({ x: nodeScreenX, y: nodeScreenY });
      setDetailNode((prev) => prev?.id === d.id ? null : { ...d, degree: degrees[d.id] || 0, neighbors });
      onNodeClick(d.id);
    });

    nodeGroup.append('circle').
    attr('class', 'node-pulse').attr('r', (d) => nodeRadius(degrees[d.id] || 0, maxDegree) + 5).
    attr('fill', 'none').attr('stroke', TEAL).attr('stroke-width', 2).attr('opacity', 0);

    nodeGroup.append('circle').
    attr('class', 'node-circle').attr('r', (d) => nodeRadius(degrees[d.id] || 0, maxDegree)).
    attr('fill', (d) => (ENTITY_TYPES[d.type] || {}).color || '#4a5568').
    attr('stroke', '#0f1117').attr('stroke-width', 2);

    nodeGrpRef.current = nodeGroup;

    const strength = tweaks?.forceStrength ?? -300;
    const sim = d3.forceSimulation(nodes).
    force('link', d3.forceLink(links).id((d) => d.id).distance(130).strength(0.7)).
    force('charge', d3.forceManyBody().strength(strength)).
    force('center', d3.forceCenter(width / 2, height / 2)).
    force('collision', d3.forceCollide().radius((d) => nodeRadius(degrees[d.id] || 0, maxDegree) + 6));
    simRef.current = sim;

    sim.on('tick', () => {
      link.
      attr('x1', (d) => d.source.x).attr('y1', (d) => d.source.y).
      attr('x2', (d) => {
        const dx = d.target.x - d.source.x,dy = d.target.y - d.source.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const r = nodeRadius(degrees[d.target.id] || 0, maxDegree) + 11;
        return d.target.x - dx / dist * r;
      }).
      attr('y2', (d) => {
        const dx = d.target.x - d.source.x,dy = d.target.y - d.source.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const r = nodeRadius(degrees[d.target.id] || 0, maxDegree) + 11;
        return d.target.y - dy / dist * r;
      });
      nodeGroup.attr('transform', (d) => `translate(${d.x ?? 0},${d.y ?? 0})`);
    });

    return () => sim.stop();
  }, [entities, triples, tweaks]);

  useEffect(() => {
    const ng = nodeGrpRef.current;
    const lg = linkGrpRef.current;
    if (!ng || !lg) return;
    if (mode === 'qa' && highlightedNodes && highlightedNodes.size > 0) {
      ng.transition().duration(400).attr('opacity', (d) => highlightedNodes.has(d.id) ? 1 : 0.1);
      lg.transition().duration(400).
      attr('stroke-opacity', (d) => highlightedEdges && highlightedEdges.has(d.id) ? 0.9 : 0.04).
      attr('stroke', (d) => highlightedEdges && highlightedEdges.has(d.id) ? EDGE_HL_COLOR : EDGE_COLOR).
      attr('marker-end', (d) => highlightedEdges && highlightedEdges.has(d.id) ? 'url(#arrow-hl)' : 'url(#arrow-normal)');
    } else {
      ng.transition().duration(400).attr('opacity', 1);
      lg.transition().duration(400).
      attr('stroke-opacity', 0.45).attr('stroke', EDGE_COLOR).attr('marker-end', 'url(#arrow-normal)');
    }
  }, [mode, highlightedNodes, highlightedEdges]);

  useEffect(() => {
    if (!nodeGrpRef.current) return;
    nodeGrpRef.current.selectAll('.node-pulse').attr('opacity', 0);
    if (!hoveredChipNodeId) return;
    const target = nodeGrpRef.current.filter((d) => d.id === hoveredChipNodeId);
    const r = nodeRadius(degreesRef.current[hoveredChipNodeId] || 0, maxDegreeRef.current);
    target.select('.node-pulse').
    attr('r', r + 4).attr('opacity', 0.9).
    transition().duration(600).
    attr('r', r + 20).attr('opacity', 0).
    on('end', function () {d3.select(this).attr('r', r + 4);});
  }, [hoveredChipNodeId]);

  const handleZoomIn = () => d3.select(svgRef.current).transition().call(zoomBehavRef.current.scaleBy, 1.4);
  const handleZoomOut = () => d3.select(svgRef.current).transition().call(zoomBehavRef.current.scaleBy, 0.72);
  const handleFitScreen = () => d3.select(svgRef.current).transition().duration(500).call(zoomBehavRef.current.transform, d3.zoomIdentity.translate(20, 20).scale(0.9));

  return (
    <div style={{ position: 'relative', width: '100%', height: '100%', background: '#0f1117', overflow: 'hidden' }}>
          <svg ref={svgRef} style={{ width: '100%', height: '100%', display: 'block' }} />
          <div style={{ position: 'absolute', top: 16, right: 16, display: 'flex', flexDirection: 'column', gap: 4 }}>
            {[
        { icon: '+', title: 'Zoom in', action: handleZoomIn },
        { icon: '−', title: 'Zoom out', action: handleZoomOut },
        { icon: '⊡', title: 'Fit to screen', action: handleFitScreen }].
        map((btn) =>
        <button key={btn.title} onClick={btn.action} title={btn.title}
        style={{
          width: 32, height: 32, border: '1px solid rgba(255,255,255,0.1)',
          background: 'rgba(24,28,38,0.92)', color: '#8892a4', borderRadius: 4,
          cursor: 'pointer', fontSize: 16, transition: 'all 0.15s'
        }}
        onMouseEnter={(e) => {e.currentTarget.style.color = TEAL;e.currentTarget.style.borderColor = 'rgba(29,233,182,0.4)';}}
        onMouseLeave={(e) => {e.currentTarget.style.color = '#8892a4';e.currentTarget.style.borderColor = 'rgba(255,255,255,0.1)';}}>
          {btn.icon}</button>
        )}
          </div>
          <div style={{ position: 'absolute', bottom: 16, left: 16 }}>
            {Object.entries(ENTITY_TYPES).map(([type, { color }]) =>
        <div key={type} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 10, color: '#5a6375', marginBottom: 4, fontFamily: "'JetBrains Mono', monospace" }}>
                <span style={{ width: 7, height: 7, borderRadius: '50%', background: color, display: 'inline-block' }} />
                {type}
              </div>
        )}
          </div>
          {detailNode &&
      <div style={{
        position: 'fixed',
        left: `${detailPos.x}px`,
        top: `${detailPos.y}px`,
        transform: 'translate(12px, -50%)',
        background: '#181c26',
        border: '1px solid rgba(124,131,232,0.25)',
        borderRadius: 6,
        padding: '12px 14px',
        minWidth: 240,
        maxWidth: 280,
        boxShadow: '0 12px 32px rgba(0,0,0,0.6)',
        zIndex: 200,
        pointerEvents: 'auto'
      }}>
              <button onClick={() => {setDetailNode(null);onNodeClick(null);}}
        style={{ position: 'absolute', top: 8, right: 8, background: 'none', border: 'none', color: '#3d4555', cursor: 'pointer', fontSize: 14, padding: 0 }}>✕</button>
              <div style={{ fontSize: 13, fontWeight: 600, color: '#e2e8f0', marginBottom: 6, paddingRight: 16 }}>{detailNode.labels[0]}</div>
              <div style={{ display: 'flex', gap: 14, fontSize: 10, marginBottom: 8 }}>
                <span style={{ color: '#6a7585' }}>conf <span style={{ color: TEAL }}>{(detailNode.metadata?.confidence || 0).toFixed(2)}</span></span>
                <span style={{ color: '#6a7585' }}>degree <span style={{ color: '#e2e8f0' }}>{detailNode.degree}</span></span>
              </div>
              <div style={{ fontSize: 10, color: '#4a5568', marginBottom: 6, textTransform: 'uppercase', fontWeight: 600 }}>Description</div>
              <div style={{ fontSize: 11, color: '#8892a4', lineHeight: 1.5 }}>{detailNode.metadata?.description}</div>
            </div>
      }
        </div>);

}

// ── LEFT SIDEBAR ────────────────────────────────────────────────────────
function LeftSidebar({ mode, onModeChange, qaHistory, selectedQaId, onQaSelect, onQaHover, serverConnected }) {
  return (
    <div style={{
      width: 240, flexShrink: 0, height: '100%',
      background: '#12151f', borderRight: '1px solid rgba(255,255,255,0.07)',
      display: 'flex', flexDirection: 'column', overflow: 'hidden'
    }}>
          <div style={{ padding: '20px 18px 16px', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
            <div style={{ fontSize: 20, fontWeight: 700, color: '#e2e8f0' }}>
              Ma<span style={{ color: TEAL }}>K</span>G
            </div>
            <div style={{ fontSize: 10, color: '#3d4555', marginTop: 4, fontFamily: "'JetBrains Mono', monospace" }}>
              RESEARCH SYSTEM
            </div>
          </div>

          <div style={{ padding: '12px 14px', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
            <div style={{ display: 'flex', gap: 0, border: '1px solid rgba(255,255,255,0.1)', borderRadius: 4, overflow: 'hidden' }}>
              {['Explore', 'QA'].map((m) => {
            const active = mode === m.toLowerCase();
            return (
              <button key={m} onClick={() => onModeChange(m.toLowerCase())}
              style={{
                flex: 1, padding: '7px 0', fontSize: 12, fontWeight: 500,
                border: 'none', cursor: 'pointer', transition: 'all 0.2s',
                background: active ? 'rgba(29,233,182,0.12)' : 'transparent',
                color: active ? TEAL : '#4a5568',
                borderRight: m === 'Explore' ? '1px solid rgba(255,255,255,0.08)' : 'none'
              }}>
                    {m}
                  </button>);

          })}
            </div>
          </div>

          <div style={{ flex: 1, overflowY: 'auto', padding: '14px 14px 0' }}>
            {mode === 'qa' &&
        <>
                <div style={{ fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#3d4555', marginBottom: 8, fontWeight: 600 }}>
                  Session history
                </div>
                {qaHistory.length === 0 &&
          <div style={{ fontSize: 12, color: '#2a3040', textAlign: 'center', padding: '24px 0', fontStyle: 'italic' }}>
                    No questions yet
                  </div>
          }
                <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                  {qaHistory.map((turn, i) => {
              const isActive = selectedQaId === turn.id;
              return (
                <button key={turn.id}
                onClick={() => onQaSelect(turn.id)}
                onMouseEnter={() => onQaHover(turn.id)}
                onMouseLeave={() => onQaHover(null)}
                style={{
                  display: 'flex', alignItems: 'flex-start', gap: 8, padding: '8px 10px',
                  background: isActive ? 'rgba(29,233,182,0.08)' : 'rgba(255,255,255,0.02)',
                  border: `1px solid ${isActive ? 'rgba(29,233,182,0.3)' : 'rgba(255,255,255,0.06)'}`,
                  borderRadius: 4, cursor: 'pointer', textAlign: 'left', transition: 'all 0.15s'
                }}>
                        <span style={{ fontSize: 10, color: '#3d4555', fontFamily: "'JetBrains Mono', monospace", flexShrink: 0, marginTop: 1 }}>Q{i + 1}</span>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 11, color: isActive ? '#c8d3e0' : '#6a7585', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                            {turn.question}
                          </div>
                          {turn.nodeCount > 0 &&
                    <div style={{ marginTop: 4 }}>
                              <span style={{ fontSize: 9, fontFamily: "'JetBrains Mono', monospace", color: TEAL, background: 'rgba(29,233,182,0.12)', padding: '1px 5px', borderRadius: 2 }}>
                                {turn.nodeCount} nodes
                              </span>
                            </div>
                    }
                        </div>
                      </button>);

            })}
                </div>
              </>
        }
          </div>

          <div style={{ padding: '12px 16px', borderTop: '1px solid rgba(255,255,255,0.06)', display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{
          width: 7, height: 7, borderRadius: '50%', flexShrink: 0,
          background: serverConnected ? '#22c55e' : '#f59e0b',
          boxShadow: serverConnected ? '0 0 0 2px rgba(34,197,94,0.25)' : '0 0 0 2px rgba(245,158,11,0.25)',
          animation: 'statusPulse 2s ease-in-out infinite'
        }} />
            <span style={{ fontSize: 10, color: '#3d4555', fontFamily: "'JetBrains Mono', monospace", letterSpacing: '0.04em' }}>
              {serverConnected ? 'Connected' : 'Mock data'}
            </span>
          </div>
        </div>);

}

// ── QA PANEL ────────────────────────────────────────────────────────────
function QAPanel({ qaHistory, onSubmitQuestion, onChipHover, selectedModel, onModelChange }) {
  const [input, setInput] = useState('');
  const [modelOpen, setModelOpen] = useState(false);
  const feedRef = useRef(null);
  const MODELS = ['GPT-4o', 'GPT-5', 'DeepSeek-v3', 'Gemma-3'];

  const handleSubmit = () => {
    const q = input.trim();
    if (!q) return;
    setInput('');
    onSubmitQuestion(q);
  };

  useEffect(() => {
    if (feedRef.current) {
      feedRef.current.scrollTop = feedRef.current.scrollHeight;
    }
  }, [qaHistory.length]);

  const isLoading = qaHistory.length > 0 && qaHistory[qaHistory.length - 1].status === 'loading';

  return (
    <div style={{
      width: 380, flexShrink: 0, height: '100%',
      background: '#181c26', borderLeft: '1px solid rgba(255,255,255,0.07)',
      display: 'flex', flexDirection: 'column', overflow: 'hidden'
    }}>
          <div style={{ padding: '14px 14px 12px', borderBottom: '1px solid rgba(255,255,255,0.07)', flexShrink: 0 }}>
            <div style={{ position: 'relative', marginBottom: 10 }}>
              <textarea
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => {if (e.key === 'Enter' && !e.shiftKey) {e.preventDefault();handleSubmit();}}}
            placeholder="Ask a question…"
            rows={3}
            disabled={isLoading}
            style={{
              width: '100%', background: '#0f1117', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 4,
              padding: '9px 12px', color: '#c8d3e0', fontSize: 12, fontFamily: "'DM Sans', sans-serif", lineHeight: 1.5,
              resize: 'none', outline: 'none', boxSizing: 'border-box', opacity: isLoading ? 0.5 : 1, transition: 'opacity 0.2s'
            }}
            onFocus={(e) => {if (!isLoading) e.target.style.borderColor = 'rgba(29,233,182,0.4)';}}
            onBlur={(e) => {e.target.style.borderColor = 'rgba(255,255,255,0.1)';}} />
            </div>

            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              <div style={{ position: 'relative', flex: 1 }}>
                <button onClick={() => setModelOpen(!modelOpen)}
                  style={{
                    display: 'flex', alignItems: 'center', gap: 5,
                    padding: '5px 10px', width: '100%', borderRadius: 3, cursor: 'pointer',
                    background: 'rgba(124,131,232,0.12)', border: '1px solid rgba(124,131,232,0.25)',
                    color: INDIGO, fontSize: 11, fontFamily: "'JetBrains Mono', monospace", textAlign: 'left',
                    transition: 'all 0.2s'
                  }}>
                  {selectedModel}
                  <svg width="8" height="8" viewBox="0 0 10 10" fill="none" style={{ marginLeft: 'auto' }}>
                    <path d="M2 4l3 3 3-3" stroke={INDIGO} strokeWidth="1.5" strokeLinecap="round"/>
                  </svg>
                </button>
                {modelOpen && (
                  <div style={{
                    position: 'absolute', top: 32, left: 0, right: 0, zIndex: 300,
                    background: '#1e2334', border: '1px solid rgba(124,131,232,0.25)',
                    borderRadius: 4, overflow: 'hidden',
                    boxShadow: '0 8px 24px rgba(0,0,0,0.5)'
                  }}>
                    {MODELS.map(m => (
                      <button key={m} onClick={() => { onModelChange(m); setModelOpen(false); }}
                        style={{
                          display: 'block', width: '100%', padding: '8px 14px', textAlign: 'left',
                          background: m === selectedModel ? 'rgba(124,131,232,0.15)' : 'transparent',
                          border: 'none', cursor: 'pointer', color: m === selectedModel ? INDIGO : '#6a7585',
                          fontSize: 12, fontFamily: "'JetBrains Mono', monospace", transition: 'background 0.1s'
                        }}
                        onMouseEnter={e => { e.currentTarget.style.background = 'rgba(124,131,232,0.1)'; }}
                        onMouseLeave={e => { e.currentTarget.style.background = m === selectedModel ? 'rgba(124,131,232,0.15)' : 'transparent'; }}>
                        {m}
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <button onClick={handleSubmit}
          disabled={!input.trim() || isLoading}
          style={{
            width: 32, height: 32, borderRadius: 4,
            background: !isLoading && input.trim() ? TEAL : 'rgba(255,255,255,0.06)',
            border: 'none', cursor: !isLoading && input.trim() ? 'pointer' : 'default',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: 'background 0.2s', flexShrink: 0
          }}>
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                  <path d="M2 8h12M10 4l4 4-4 4" stroke={!isLoading && input.trim() ? '#0f1117' : '#3d4555'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
              </button>
            </div>
          </div>

          <div ref={feedRef} style={{ flex: 1, overflowY: 'auto', padding: '16px 14px' }}>
            {qaHistory.map((turn, idx) => {
              const isLastTurn = idx === qaHistory.length - 1;
              const showLoadingState = isLastTurn && turn.status === 'loading';
              return (
                <div key={turn.id} style={{ marginBottom: 20, opacity: showLoadingState ? 0.4 : 1, transition: 'opacity 0.3s ease' }}>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 10 }}>
                    <div style={{
                      maxWidth: '82%', padding: '9px 13px', borderRadius: '4px 4px 2px 4px',
                      background: 'rgba(29,233,182,0.1)', border: '1px solid rgba(29,233,182,0.2)',
                      fontSize: 13, color: '#c8d3e0'
                    }}>
                      {turn.question}
                    </div>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'flex-start' }}>
                    <div style={{
                      maxWidth: '95%', padding: '10px 13px', borderRadius: '2px 4px 4px 4px',
                      background: '#1e2334', border: '1px solid rgba(255,255,255,0.07)',
                      fontSize: 13, color: '#8892a4', lineHeight: 1.65,
                      minHeight: showLoadingState ? 80 : 'auto'
                    }}>
                      {showLoadingState ? (
                        <div style={{ display: 'flex', gap: 6, alignItems: 'center', padding: '8px 0' }}>
                          <span style={{ fontSize: 12, color: '#3d4555', fontStyle: 'italic' }}>Routing to domain experts</span>
                          {[0,1,2].map(i => (
                            <span key={i} style={{ width: 5, height: 5, borderRadius: '50%', background: TEAL, display: 'inline-block', animation: `dotBounce 1.2s ${i * 0.2}s ease-in-out infinite` }} />
                          ))}
                        </div>
                      ) : (
                        <>
                          <div style={{ marginBottom: 8, fontSize: 10, fontFamily: "'JetBrains Mono', monospace", color: INDIGO, background: 'rgba(124,131,232,0.12)', padding: '2px 7px', borderRadius: 2, display: 'inline-block' }}>
                            {turn.model}
                          </div>
                          <div style={{ marginTop: 8 }}>{turn.answer}</div>
                          {turn.referencedNodes && turn.referencedNodes.size > 0 &&
                            <div style={{ marginTop: 10, display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                              {Array.from(turn.referencedNodes).slice(0, 6).map((nid) => {
                                const entity = ENTITIES.find((e) => e.id === nid);
                                const color = (ENTITY_TYPES[entity?.type] || {}).color || '#4a5568';
                                return (
                                  <div key={nid}
                                    onMouseEnter={() => onChipHover(nid)}
                                    onMouseLeave={() => onChipHover(null)}
                                    style={{
                                      display: 'inline-flex', alignItems: 'center', gap: 5,
                                      padding: '3px 8px', borderRadius: 3, cursor: 'default', flexShrink: 0,
                                      background: `${color}18`, border: `1px solid ${color}44`,
                                      fontSize: 11, color: '#c8d3e0', fontFamily: "'JetBrains Mono', monospace"
                                    }}>
                                    <span style={{ width: 6, height: 6, borderRadius: '50%', background: color }} />
                                    <span style={{ maxWidth: 120, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontSize: 10 }}>
                                      {entity?.labels[0] || nid}
                                    </span>
                                  </div>
                                );
                              })}
                            </div>
                          }
                        </>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>);

}

// ── MAIN APP ────────────────────────────────────────────────────────────
function App() {
  const [mode, setMode] = useState('explore');
  const [selectedModel, setModel] = useState('GPT-4o');
  const [serverConnected, setServer] = useState(false);
  const [qaHistory, setQaHistory] = useState([]);
  const [selectedQaId, setSelectedQaId] = useState(null);
  const [hoveredQaId, setHoveredQaId] = useState(null);
  const [selectedNodeId, setSelectedNodeId] = useState(null);
  const [hoveredChipNodeId, setHoveredChipNodeId] = useState(null);
  const hasLoadedSamples = useRef(false);

  useEffect(() => {
    fetch('http://localhost:8000/health').
    then((r) => r.ok && setServer(true)).
    catch(() => setServer(false));
  }, []);

  const { highlightedNodes, highlightedEdges } = useMemo(() => {
    const qaId = hoveredQaId || selectedQaId;
    if (!qaId || mode !== 'qa') return { highlightedNodes: new Set(), highlightedEdges: new Set() };
    const turn = qaHistory.find((t) => t.id === qaId);
    if (!turn) return { highlightedNodes: new Set(), highlightedEdges: new Set() };
    return { highlightedNodes: turn.referencedNodes || new Set(), highlightedEdges: turn.referencedEdges || new Set() };
  }, [hoveredQaId, selectedQaId, qaHistory, mode]);

  const handleSubmitQuestion = useCallback(async (question) => {
    const turnId = `qa_${Date.now()}`;
    // Start with loading state
    setQaHistory((prev) => [...prev, {
      id: turnId, question, status: 'loading',
      answer: '', referencedNodes: new Set(), referencedEdges: new Set(),
      nodeCount: 0, model: selectedModel
    }]);
    setSelectedQaId(turnId);
    if (mode !== 'qa') setMode('qa');

    // Simulate 1.2s routing delay, then show answer
    await new Promise(r => setTimeout(r, 1200));
    setQaHistory((prev) => prev.map(t =>
      t.id === turnId ? {
        ...t, status: 'done',
        answer: 'Mock response. Connect to server for live answers.',
        referencedNodes: new Set(['type2_diabetes', 'hba1c', 'elisa']),
        referencedEdges: new Set(['t1', 't2']),
        nodeCount: 3
      } : t
    ));
  }, [selectedModel, mode]);

  useEffect(() => {
    if (mode === 'qa' && qaHistory.length === 0 && !hasLoadedSamples.current) {
      hasLoadedSamples.current = true;
      SAMPLE_QA.forEach((qa, i) => {
        setTimeout(() => {
          setQaHistory((prev) => [...prev, { ...qa, status: 'done' }]);
          if (i === 0) setSelectedQaId(qa.id);
        }, i * 80);
      });
    }
  }, [mode]);

  const tweaks = { forceStrength: -300, edgeOpacity: 0.45, showAllLabels: false };

  return (
    <div style={{ display: 'flex', height: '100vh', width: '100vw', overflow: 'hidden', background: '#0f1117' }}>
          <LeftSidebar
        mode={mode} onModeChange={setMode}
        qaHistory={qaHistory}
        selectedQaId={selectedQaId}
        onQaSelect={(id) => setSelectedQaId((prev) => prev === id ? null : id)}
        onQaHover={setHoveredQaId}
        serverConnected={serverConnected} />
      

          <div style={{ flex: 1, position: 'relative', minWidth: 0 }}>
            <GraphCanvas
          entities={ENTITIES}
          triples={TRIPLES}
          mode={mode}
          highlightedNodes={highlightedNodes}
          highlightedEdges={highlightedEdges}
          selectedNodeId={selectedNodeId}
          onNodeClick={(id) => setSelectedNodeId((prev) => prev === id ? null : id)}
          hoveredChipNodeId={hoveredChipNodeId}
          tweaks={tweaks} />
        

            {mode === 'qa' &&
        <div style={{
          position: 'absolute', inset: 0, pointerEvents: 'none',
          background: 'rgba(15,17,23,0.18)', transition: 'opacity 0.4s'
        }} />
        }

            <div style={{
          position: 'absolute', top: 16, left: 16,
          padding: '4px 10px', borderRadius: 3, fontSize: 10,
          fontFamily: "'JetBrains Mono', monospace", letterSpacing: '0.08em',
          background: mode === 'qa' ? 'rgba(124,131,232,0.15)' : 'rgba(29,233,182,0.12)',
          color: mode === 'qa' ? '#7c83e8' : '#1de9b6',
          border: `1px solid ${mode === 'qa' ? 'rgba(124,131,232,0.25)' : 'rgba(29,233,182,0.2)'}`,
          pointerEvents: 'none'
        }}>
              {mode === 'qa' ? 'QA — EVIDENCE VIEW' : 'EXPLORE'}
            </div>
          </div>

          <div style={{
        width: mode === 'qa' ? 380 : 0,
        overflow: 'hidden',
        transition: 'width 0.28s cubic-bezier(0.4,0,0.2,1)',
        flexShrink: 0
      }}>
            <div style={{ width: 380, height: '100%' }}>
              <QAPanel
            qaHistory={qaHistory}
            onSubmitQuestion={handleSubmitQuestion}
            onChipHover={setHoveredChipNodeId}
            selectedModel={selectedModel}
            onModelChange={setModel} />
          
            </div>
          </div>
        </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
