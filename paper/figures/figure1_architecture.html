<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 1 — Governed Knowledge Graph Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 36px;
      font-family: 'STIX Two Text', 'Times New Roman', Georgia, serif;
    }
    svg {
      display: block;
      max-width: 100%;
      height: auto;
    }
    /* Print: full-bleed white, hide browser chrome */
    @media print {
      body { padding: 0; }
      svg  { width: 100%; }
    }
  </style>
</head>
<body>

<svg viewBox="0 0 920 950" width="920" height="950"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'STIX Two Text', 'Times New Roman', Georgia, serif">

  <!-- ───────────────────────────── DEFS ───────────────────────────── -->
  <defs>

    <!-- Subtle band shadow -->
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#00000018"/>
    </filter>

    <!-- Arrowhead templates — one per color family -->
    <!-- Default (dark gray) -->
    <marker id="arr" viewBox="0 0 9 7" refX="9" refY="3.5"
            markerWidth="6" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#374151"/>
    </marker>
    <!-- Purple (deliberation) -->
    <marker id="arrP" viewBox="0 0 9 7" refX="9" refY="3.5"
            markerWidth="6" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#6D28D9"/>
    </marker>
    <!-- Amber (governance) -->
    <marker id="arrA" viewBox="0 0 9 7" refX="9" refY="3.5"
            markerWidth="6" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#B45309"/>
    </marker>
    <!-- Green (KG / subgraph) -->
    <marker id="arrG" viewBox="0 0 9 7" refX="9" refY="3.5"
            markerWidth="6" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#16A34A"/>
    </marker>
    <!-- Teal (application) -->
    <marker id="arrT" viewBox="0 0 9 7" refX="9" refY="3.5"
            markerWidth="6" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#0D9488"/>
    </marker>
    <!-- Light gray (bypass) -->
    <marker id="arrB" viewBox="0 0 9 7" refX="9" refY="3.5"
            markerWidth="5" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#9CA3AF"/>
    </marker>
  </defs>


  <!-- ═══════════════════════════════════════════════════════════════════
       DOCUMENT CORPUS  (above bands)
  ══════════════════════════════════════════════════════════════════════ -->
  <text x="460" y="24" text-anchor="middle"
        font-size="15" font-weight="bold" fill="#111827">Document Corpus</text>
  <line x1="460" y1="29" x2="460" y2="46"
        stroke="#374151" stroke-width="1.3" marker-end="url(#arr)"/>


  <!-- ═══════════════════════════════════════════════════════════════════
       CREATION LAYER   y 49 – 486
  ══════════════════════════════════════════════════════════════════════ -->
  <rect x="12" y="49" width="896" height="437" rx="9"
        fill="#F7FAFF" stroke="#2563A8" stroke-width="1.3" filter="url(#shadow)"/>

  <text x="27" y="72" font-size="13" font-weight="bold" fill="#1E3A8A">Creation Layer</text>

  <!-- ── Stage-number badges ── -->
  <text x="80"  y="105" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2563A8">1</text>
  <text x="215" y="105" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2563A8">2</text>
  <text x="350" y="105" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2563A8">3</text>
  <text x="485" y="105" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2563A8">4</text>
  <text x="620" y="105" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2563A8">5</text>

  <!-- ── Worker agent boxes (y_centre = 135) ── -->
  <!-- 1: Doc Processor -->
  <rect x="27"  y="110" width="106" height="50" rx="6" fill="#DBEAFE" stroke="#2563A8" stroke-width="1.25"/>
  <text x="80"  y="132" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A8A">Doc</text>
  <text x="80"  y="147" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A8A">Processor</text>

  <!-- 2: Domain Classifier -->
  <rect x="162" y="110" width="106" height="50" rx="6" fill="#DBEAFE" stroke="#2563A8" stroke-width="1.25"/>
  <text x="215" y="132" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A8A">Domain</text>
  <text x="215" y="147" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A8A">Classifier</text>

  <!-- 3: Entity Extractor -->
  <rect x="297" y="110" width="106" height="50" rx="6" fill="#DBEAFE" stroke="#2563A8" stroke-width="1.25"/>
  <text x="350" y="132" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A8A">Entity</text>
  <text x="350" y="147" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A8A">Extractor</text>

  <!-- 4: Relation Extractor -->
  <rect x="432" y="110" width="106" height="50" rx="6" fill="#DBEAFE" stroke="#2563A8" stroke-width="1.25"/>
  <text x="485" y="132" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A8A">Relation</text>
  <text x="485" y="147" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A8A">Extractor</text>

  <!-- 5: Evidence Linker -->
  <rect x="567" y="110" width="106" height="50" rx="6" fill="#DBEAFE" stroke="#2563A8" stroke-width="1.25"/>
  <text x="620" y="132" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A8A">Evidence</text>
  <text x="620" y="147" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A8A">Linker</text>

  <!-- Sequential worker arrows -->
  <line x1="133" y1="135" x2="162" y2="135" stroke="#374151" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="268" y1="135" x2="297" y2="135" stroke="#374151" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="403" y1="135" x2="432" y2="135" stroke="#374151" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="538" y1="135" x2="567" y2="135" stroke="#374151" stroke-width="1.15" marker-end="url(#arr)"/>

  <!-- ── Shared Memory sidebar (dashed) ── -->
  <rect x="750" y="88" width="142" height="332" rx="7"
        fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.1" stroke-dasharray="6,3.5"/>
  <text x="821" y="114" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#374151">Shared Memory</text>
  <text x="821" y="140" text-anchor="middle" font-size="8.5" fill="#6B7280">· Episodic</text>
  <text x="821" y="163" text-anchor="middle" font-size="8.5" fill="#6B7280">· Semantic</text>
  <text x="821" y="186" text-anchor="middle" font-size="8.5" fill="#6B7280">· Working</text>
  <text x="821" y="209" text-anchor="middle" font-size="8.5" fill="#6B7280">· Blackboard</text>

  <!-- Dashed links: workers → Shared Memory (two representative) -->
  <line x1="403" y1="135" x2="750" y2="135"
        stroke="#CBD5E1" stroke-width="0.85" stroke-dasharray="5,3.5"/>
  <line x1="673" y1="135" x2="750" y2="135"
        stroke="#CBD5E1" stroke-width="0.85" stroke-dasharray="5,3.5"/>

  <!-- ── Deliberation — Stage 6 (y_centre = 218) ── -->
  <rect x="272" y="183" width="272" height="68" rx="7"
        fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.3"/>
  <text x="408" y="209" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4C1D95">Deliberation  (Stage 6)</text>
  <text x="408" y="227" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4C1D95">Multi-Agent Vote &amp; Debate</text>

  <!-- Arrow: Evidence Linker → Deliberation (uncertain branch) -->
  <line x1="620" y1="160" x2="544" y2="185"
        stroke="#6D28D9" stroke-width="1.15" marker-end="url(#arrP)"/>
  <text x="616" y="175" text-anchor="end"
        font-size="7.5" font-style="italic" fill="#5B21B6">conf 0.35–0.65</text>

  <!-- Dashed: Deliberation ↔ Shared Memory -->
  <line x1="544" y1="218" x2="750" y2="218"
        stroke="#CBD5E1" stroke-width="0.85" stroke-dasharray="5,3.5"/>

  <!-- Arrow: Deliberation → Extraction Validator -->
  <line x1="300" y1="251" x2="213" y2="292"
        stroke="#6D28D9" stroke-width="1.15" marker-end="url(#arrP)"/>

  <!-- Bypass arrow: conf ≥ 0.65 (curved, light gray) -->
  <path d="M 620 160 C 665 265 220 240 210 292"
        stroke="#9CA3AF" stroke-width="1.0" fill="none" marker-end="url(#arrB)"/>
  <text x="84" y="242" text-anchor="middle" font-size="7.5" font-style="italic" fill="#9CA3AF">conf ≥ 0.65</text>
  <text x="84" y="255" text-anchor="middle" font-size="7.5" font-style="italic" fill="#9CA3AF">(bypass)</text>

  <!-- ── Coordinator agent boxes (y_centre = 322) ── -->
  <text x="127" y="284" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#C2410C">7</text>
  <text x="332" y="284" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#C2410C">8</text>
  <text x="537" y="284" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#C2410C">9</text>

  <!-- 7: Extraction Validator -->
  <rect x="43"  y="290" width="168" height="58" rx="6" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.25"/>
  <text x="127" y="316" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7C2D12">Extraction</text>
  <text x="127" y="331" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7C2D12">Validator</text>

  <!-- 8: Extraction Verification -->
  <rect x="248" y="290" width="168" height="58" rx="6" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.25"/>
  <text x="332" y="316" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7C2D12">Extraction</text>
  <text x="332" y="331" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7C2D12">Verification</text>

  <!-- 9: Knowledge Organizer -->
  <rect x="453" y="290" width="168" height="58" rx="6" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.25"/>
  <text x="537" y="316" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7C2D12">Knowledge</text>
  <text x="537" y="331" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7C2D12">Organizer</text>

  <!-- Coordinator sequential arrows -->
  <line x1="211" y1="319" x2="248" y2="319" stroke="#374151" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="416" y1="319" x2="453" y2="319" stroke="#374151" stroke-width="1.15" marker-end="url(#arr)"/>

  <!-- Dashed: KnowledgeOrganizer → Shared Memory -->
  <line x1="621" y1="319" x2="750" y2="319"
        stroke="#CBD5E1" stroke-width="0.85" stroke-dasharray="5,3.5"/>

  <!-- "all agents" note near SM -->
  <text x="821" y="260" text-anchor="middle" font-size="7.5" font-style="italic" fill="#9CA3AF">(all agents)</text>

  <!-- Arrow: KnowledgeOrganizer ↓ Governance -->
  <line x1="537" y1="348" x2="537" y2="497"
        stroke="#374151" stroke-width="1.15" marker-end="url(#arr)"/>
  <text x="552" y="426" text-anchor="start"
        font-size="8" font-style="italic" fill="#6B7280">verified triples</text>

  <!-- Tick marks / quality label on creation band -->
  <text x="460" y="462" text-anchor="middle"
        font-size="7.5" fill="#6B7280" font-style="italic">
    Sequential pipeline · deliberation activates only when confidence ∈ [0.35, 0.65)
  </text>


  <!-- ═══════════════════════════════════════════════════════════════════
       GOVERNANCE LAYER   y 500 – 688
  ══════════════════════════════════════════════════════════════════════ -->
  <rect x="12" y="500" width="896" height="188" rx="9"
        fill="#FFFEF5" stroke="#CA8A04" stroke-width="1.2" filter="url(#shadow)"/>

  <text x="27" y="522" font-size="13" font-weight="bold" fill="#78350F">Governance Layer</text>

  <!-- Gov box 1: Propose -->
  <rect x="30"  y="541" width="158" height="64" rx="6" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.25"/>
  <text x="109" y="569" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#78350F">Propose</text>
  <text x="109" y="584" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#78350F">Triple</text>

  <!-- Gov box 2: Route -->
  <rect x="220" y="541" width="168" height="64" rx="6" fill="#FDE68A" stroke="#B45309" stroke-width="1.25"/>
  <text x="304" y="569" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#92400E">Route</text>
  <text x="304" y="584" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#92400E">(φ: ownership)</text>

  <!-- Gov box 3: Triage Board -->
  <rect x="424" y="541" width="168" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.25"/>
  <text x="508" y="569" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7F1D1D">Triage</text>
  <text x="508" y="584" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7F1D1D">Board</text>

  <!-- Gov box 4: Commit + Audit -->
  <rect x="628" y="541" width="180" height="64" rx="6" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.25"/>
  <text x="718" y="569" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#831843">Commit</text>
  <text x="718" y="584" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#831843">+ Audit Log</text>

  <!-- Governance step arrows -->
  <line x1="188" y1="573" x2="220" y2="573" stroke="#B45309" stroke-width="1.15" marker-end="url(#arrA)"/>
  <line x1="388" y1="573" x2="424" y2="573" stroke="#B45309" stroke-width="1.15" marker-end="url(#arrA)"/>
  <line x1="592" y1="573" x2="628" y2="573" stroke="#B45309" stroke-width="1.15" marker-end="url(#arrA)"/>

  <!-- Triage outcome labels -->
  <text x="508" y="621" text-anchor="middle" font-size="8.5" font-style="italic" fill="#166534">auto-approve</text>
  <text x="508" y="641" text-anchor="middle" font-size="8.5" font-style="italic" fill="#1D4ED8">cross-domain review</text>
  <text x="508" y="661" text-anchor="middle" font-size="8.5" font-style="italic" fill="#991B1B">revise / reject</text>

  <!-- Arrow: Commit → Governed KG -->
  <line x1="718" y1="605" x2="718" y2="695"
        stroke="#374151" stroke-width="1.15" marker-end="url(#arr)"/>
  <text x="706" y="652" text-anchor="end"
        font-size="8" font-style="italic" fill="#6B7280">admitted triples</text>


  <!-- ═══════════════════════════════════════════════════════════════════
       GOVERNED KNOWLEDGE GRAPH   y 698 – 790
  ══════════════════════════════════════════════════════════════════════ -->
  <rect x="12" y="698" width="896" height="92" rx="9"
        fill="#DCFCE7" stroke="#16A34A" stroke-width="2.0" filter="url(#shadow)"/>

  <text x="460" y="743" text-anchor="middle"
        font-size="18" font-weight="bold" fill="#14532D">Governed Knowledge Graph</text>
  <text x="460" y="768" text-anchor="middle"
        font-size="10.5" fill="#166534">Entities  ·  Triples  ·  Domain Org Chart  ·  Audit Log</text>

  <!-- Arrow: KG → Application (QA Orchestrator) -->
  <line x1="310" y1="790" x2="310" y2="808"
        stroke="#374151" stroke-width="1.15" marker-end="url(#arr)"/>


  <!-- ═══════════════════════════════════════════════════════════════════
       APPLICATION LAYER   y 812 – 912
  ══════════════════════════════════════════════════════════════════════ -->
  <rect x="12" y="812" width="896" height="100" rx="9"
        fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" filter="url(#shadow)"/>

  <text x="27" y="834" font-size="13" font-weight="bold" fill="#134E4A">Application Layer</text>

  <!-- App box 1: User Query -->
  <rect x="30"  y="843" width="148" height="54" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.25"/>
  <text x="104" y="867" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#134E4A">User</text>
  <text x="104" y="882" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#134E4A">Query</text>

  <!-- App box 2: QA Orchestrator -->
  <rect x="218" y="843" width="168" height="54" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.25"/>
  <text x="302" y="867" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#134E4A">QA</text>
  <text x="302" y="882" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#134E4A">Orchestrator</text>

  <!-- App box 3: Domain Expert Routing -->
  <rect x="428" y="843" width="186" height="54" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.25"/>
  <text x="521" y="867" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#134E4A">Domain Expert</text>
  <text x="521" y="882" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#134E4A">Routing</text>

  <!-- App box 4: Synthesized Answer -->
  <rect x="660" y="843" width="172" height="54" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.25"/>
  <text x="746" y="867" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#134E4A">Synthesized</text>
  <text x="746" y="882" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#134E4A">Answer</text>

  <!-- App sequential arrows -->
  <line x1="178" y1="870" x2="218" y2="870" stroke="#0D9488" stroke-width="1.15" marker-end="url(#arrT)"/>
  <line x1="386" y1="870" x2="428" y2="870" stroke="#0D9488" stroke-width="1.15" marker-end="url(#arrT)"/>
  <line x1="614" y1="870" x2="660" y2="870" stroke="#0D9488" stroke-width="1.15" marker-end="url(#arrT)"/>

  <!-- Bidirectional: Domain Expert Routing ↔ KG (subgraph retrieval) -->
  <path d="M 521 843 L 620 790"
        stroke="#16A34A" stroke-width="1.2" fill="none"
        marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="634" y="818" text-anchor="start"
        font-size="8" font-style="italic" fill="#166534">subgraph retrieval</text>


  <!-- ═══════════════════════════════════════════════════════════════════
       LEGEND
  ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 926)">
    <!-- Worker -->
    <rect x="0" y="0" width="14" height="11" rx="2" fill="#DBEAFE" stroke="#2563A8" stroke-width="1"/>
    <text x="18" y="9.5" font-size="9" fill="#374151">Worker agents (1–5)</text>

    <!-- Deliberation -->
    <rect x="168" y="0" width="14" height="11" rx="2" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1"/>
    <text x="186" y="9.5" font-size="9" fill="#374151">Deliberation (Stage 6)</text>

    <!-- Coordinator -->
    <rect x="356" y="0" width="14" height="11" rx="2" fill="#FFEDD5" stroke="#C2410C" stroke-width="1"/>
    <text x="374" y="9.5" font-size="9" fill="#374151">Coordinator agents (7–9)</text>

    <!-- Shared Memory -->
    <rect x="564" y="0" width="14" height="11" rx="2"
          fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="582" y="9.5" font-size="9" fill="#374151">Shared Memory (dashed)</text>
  </g>

</svg>

</body>
</html>
